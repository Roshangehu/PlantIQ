[project]
name = "plantiq-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "roshan joshi", email = "roshanjoshi127@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.3",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "st-click-detector>=0.1.3",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
plantiq-ai = "plantiq_ai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
